<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            #content {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
            }

            video, img {
                max-width: 100%;
                max-height: 100%;
                width: auto;
                height: auto;
                object-fit: contain;
            }
        </style>
    </head>
    <body>
        <div id="content" style="border: 1px solid black;">
        </div>
        <script>
            function createVideoElement(src){
                const contentDiv = document.querySelector("#content");
                const videoElementCreateStr = `<video src="${src}" muted loop autoplay playsinline preload="none"></video>`;
                contentDiv.innerHTML = videoElementCreateStr;
            }
            
            switch (decodeURI(location.hash)) {
                case "#VODMaster Stat Graph":
                    createVideoElement("VODMaster Stat Graph.mp4");
                    break;
                case "#VODMaster Stat Graph Official":
                    createVideoElement("VODMaster Stat Graph Official.mp4");
                    break;
                default:
                    console.log("No matching hash found.", location.hash);
                    break;
            }
        </script>
    </body>
</html>
